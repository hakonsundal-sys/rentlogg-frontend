<!--
  Rentlogg-merket: tre loggføringer og en hake. Samme fire paths som BrandMark i
  src/components/shared.jsx — endres de ett sted, må de endres begge.

  Her, og bare her, står merket på en fylt flate: en ren strekversjon grøter seg sammen på en
  nettleserfane på 16px. Inne i appen tegnes det bart, fordi den avrundede gradient-brikken er
  formen cleanlog.no bruker til sitt eget merke.

  Erstattet en lilla plassholder-blob som ikke matchet noe i appen — den var igjen fra et
  designverktøy og hadde aldri noe med Rentlogg å gjøre.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Rentlogg">
  <rect width="32" height="32" rx="7.5" fill="#6d28d9"/>
  <g transform="translate(16 16) scale(.72) translate(-16 -16)"
     fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 7.5h12"/>
    <path d="M5 15h9"/>
    <path d="M5 22.5h7"/>
    <path d="m17.5 19.6 3.6 3.6L29 15"/>
  </g>
</svg>
