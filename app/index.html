<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1e2a38" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Rentlogg</title>

    <!--
      Selve appen. Den lå på roten fram til landingssiden ble bygget; nå er roten en offentlig
      side og innloggingen bor her, på /app/.

      Denne siden skal IKKE indekseres: den er ren applikasjon uten innhold for en crawler, og
      to adresser som begge heter "Rentlogg" i søk er bare forvirrende. Landingssiden på roten
      er den som skal rangere.
    -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://www.rentlogg.no/" />

    <!--
      Fonten lastes her også, ikke bare via index.css, fordi den er kritisk for første maling
      og bundelen kommer først etter et rundturskall til. Bare latin-subsettet forhåndslastes;
      latin-ext hentes ved behov av litauisk/latvisk, og russisk bruker systemfonten uansett.
    -->
    <link
      rel="preload"
      href="/fonts/schibsted-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
